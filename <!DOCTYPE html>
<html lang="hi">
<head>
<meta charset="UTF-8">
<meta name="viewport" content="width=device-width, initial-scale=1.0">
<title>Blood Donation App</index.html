<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Donation App</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:20px;
}
.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
h1{
    text-align:center;
    color:red;
}
input,select,button{
    width:100%;
    padding:10px;
    margin:8px 0;
}
button{
    background:red;
    color:white;
    border:none;
    cursor:pointer;
}
.donor{
    background:#ffeaea;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
}
</style>
</head>

<body>

<div class="container">
<h1>🩸 Blood Donation App</h1>

<input type="text" id="name" placeholder="नाम">
<input type="text" id="phone" placeholder="मोबाइल नंबर">

<select id="blood">
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>O+</option>
<option>O-</option>
<option>AB+</option>
<option>AB-</option>
</select>

<button onclick="addDonor()">Donor Add करें</button>

<h3>Donor List</h3>
<div id="donorList"></div>
</div>

<script>
let donors = [];

function addDonor(){
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let blood = document.getElementById("blood").value;

    if(name==="" || phone===""){
        alert("सभी जानकारी भरें");
        return;
    }

    donors.push({name, phone, blood});
    showDonors();

    document.getElementById("name").value="";
    document.getElementById("phone").value="";
}

function showDonors(){
    let list = document.getElementById("donorList");
    list.innerHTML="";

    donors.forEach(donor=>{
        list.innerHTML += `
        <div class="donor">
            <b>${donor.name}</b><br>
            📞 ${donor.phone}<br>
            🩸 ${donor.blood}
        </div>`;
    });
}
</script>

</body>
</html>
